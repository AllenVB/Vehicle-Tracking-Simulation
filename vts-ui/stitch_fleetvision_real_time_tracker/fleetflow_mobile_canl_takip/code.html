<!-- Interaction Script -->
<script>
        // Subtle speed variance simulation
        const speedEl = document.getElementById('speed-display');
        let currentSpeed = 84;
        
        setInterval(() => {
            const variance = Math.floor(Math.random() * 3) - 1; // -1, 0, or 1
            currentSpeed += variance;
            // Clamp speed for visual demo
            if(currentSpeed < 80) currentSpeed = 80;
            if(currentSpeed > 88) currentSpeed = 88;
            speedEl.textContent = currentSpeed;
        }, 3000);

        // Simple touch feedback for FAB
        const fab = document.querySelector('button.fixed');
        fab.addEventListener('touchstart', () => {
            fab.classList.add('brightness-90');
        });
        fab.addEventListener('touchend', () => {
            fab.classList.remove('brightness-90');
        });
    </script>
