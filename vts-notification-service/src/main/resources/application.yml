spring:
  application:
    name: vts-notification-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vts}
    username: ${DB_USER:vts}
    password: ${DB_PASSWORD:vts}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Kafka uzerinden iz zincirini surdurur: uretici, iz kimligini mesaj basligina
    # yazar; tuketici onu okuyup kendi span'ini ayni ize baglar. Bu ayar olmadan zincir
    # tam Kafka'da kopar ve geriye birbirine baglanmayan iki yarim iz kalir -- oysa
    # hattaki en uzun bekleme genellikle tam orada.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: vts-notification
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # Kritik ihlal e-postalari icin SMTP. Dev'de MailHog (kimlik/TLS yok); host her
  # zaman set oldugu icin Boot JavaMailSender bean'ini otomatik yapilandirir. Yerel
  # (konteynersiz) calismada MailHog yoksa gonderim baglanti hatasiyla FAILED kaydolur.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8084

vts:
  notification:
    email:
      # Gonderen adresi ve e-posta uretecek en dusuk onem duzeyi. min-severity
      # varsayilan CRITICAL: yalnizca en agir ihlaller mail uretir; WEBSOCKET her
      # ihlali almaya devam eder. MailHog demosunda MAIL_MIN_SEVERITY=HIGH ile
      # gecici olarak dusurulup mail akisi gozlenebilir.
      from: ${MAIL_FROM:fleet-alerts@vts.local}
      min-severity: ${MAIL_MIN_SEVERITY:CRITICAL}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  # Dagitik izleme. Ornekleme %2: 105 arac saniyede bir olcum gonderiyor, hepsini
  # izlemek saniyede ~600 span eder ve Jaeger'in bellegini birkac dakikada doldurur.
  # Yuzde iki, dakikada ~120 iz demek -- bir hattin nasil davrandigini gormek icin fazlasiyla
  # yeterli, sistemi tasimayacagi bir yuke sokmadan.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.02}
  otlp:
    tracing:
      # Uc verilmezse Boot varsayilan olarak localhost'a gonderir ve her istek sessizce
      # basarisiz olur; compose bunu jaeger'a yonlendirir.
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
